<script>
/* ================= setup ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,PANEL=190;let H=700,scale=1,dpr=1;
function resize(){
  const vw=innerWidth,vh=innerHeight;
  H=Math.max(600,Math.min(880,Math.round(W*vh/vw)));
  scale=Math.min(vw/W,vh/H);dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.style.marginTop=Math.max(0,(vh-H*scale)/2)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',resize);resize();
const SH=()=>H-PANEL, GY=()=>Math.round((H-PANEL)*0.82);
const FH=(s,w)=>`${w||700} ${s}px Oswald, 'Arial Narrow', Impact, sans-serif`;
const FS=s=>`italic ${s}px Lora, Georgia, serif`;
const FB=(s,w)=>`${w||400} ${s}px system-ui, -apple-system, 'Segoe UI', sans-serif`;
const COL='#0b0609', RIM='#fb923c';
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrapLines(text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    if(para===''){out.push('');continue;}
    let line='';
    for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}
    out.push(line);
  }
  return out;
}
function wrap(text,x,y,maxW,lh){let yy=y;for(const l of wrapLines(text,maxW)){if(l==='')yy+=lh*0.5;else{ctx.fillText(l,x,yy);yy+=lh;}}return yy;}
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

/* ================= audio ================= */
let AC=null,MG=null,NB=null,muted=false,growlG=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();MG=AC.createGain();MG.gain.value=muted?0:0.7;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=320;
    const g=AC.createGain();g.gain.value=0.05;s.connect(f);f.connect(g);g.connect(MG);s.start();
    // continuous growl, volume follows rage
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=62;
    const lf=AC.createOscillator();lf.frequency.value=7;const lg=AC.createGain();lg.gain.value=8;lf.connect(lg);lg.connect(o.frequency);
    const gf=AC.createBiquadFilter();gf.type='lowpass';gf.frequency.value=260;
    growlG=AC.createGain();growlG.gain.value=0;o.connect(gf);gf.connect(growlG);growlG.connect(MG);o.start();lf.start();
  }catch(e){AC=null;}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC)return;try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  env(g,t,0.01,vol,dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function noise(dur,freq,q,vol,type,delay,f2,attack){
  if(!AC)return;try{const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);
  if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q;
  const g=AC.createGain();env(g,t,attack||0.02,vol,dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random());s.stop(t+dur+(attack||0)+0.05);}catch(e){}
}
const SFX={
  lubdub(v){tone(68,40,0.16,'sine',0.7*v);tone(62,38,0.14,'sine',0.4*v,0.17);},
  snarl(){tone(180,90,0.5,'sawtooth',0.2);noise(0.5,700,0.8,0.3,'bandpass',0,300);},
  yelp(){tone(900,500,0.18,'triangle',0.2);tone(800,450,0.15,'triangle',0.15,0.2);},
  roar(){tone(150,55,0.9,'sawtooth',0.28);noise(0.9,500,0.6,0.45,'lowpass',0,150);},
  lowgrowl(){tone(85,70,1.0,'sawtooth',0.18);},
  chirp(){tone(1400,1900,0.1,'sine',0.2);tone(1500,2100,0.1,'sine',0.2,0.14);},
  fight(){for(let i=0;i<5;i++){noise(0.12,400+Math.random()*900,1,0.4,'bandpass',i*0.16);tone(200,90,0.15,'sawtooth',0.15,i*0.16+0.05);}},
  inhale(){noise(3,500,0.6,0.22,'bandpass',0,1400,1.2);},
  exhale(){noise(5,1100,0.6,0.25,'bandpass',0,300,0.4);},
  good(){tone(440,660,0.25,'triangle',0.18);tone(660,880,0.25,'triangle',0.12,0.15);},
  bad(){tone(220,150,0.2,'triangle',0.14);},
  click(){tone(900,700,0.05,'triangle',0.12);}
};
function toggleMute(){muted=!muted;if(MG)MG.gain.value=muted?0:0.7;}

/* ================= art ================= */
function leg(hx,hy,a,amp,lift,thick,claw){
  const sw=Math.sin(a)*amp,up=Math.max(0,Math.cos(a))*lift;
  const fx=hx+4+sw,fy=-up,kx=hx+9+sw*0.4,ky=hy+(fy-hy)*0.35,ax=fx-6,ay=fy-7;
  ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(kx,ky);ctx.stroke();
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(ax,ay);ctx.lineTo(fx,fy);ctx.lineTo(fx+8,fy);ctx.stroke();
  if(claw){ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(fx+1,fy-1);ctx.quadraticCurveTo(fx+3,fy-7,fx+7,fy-5);ctx.stroke();}
}
function raptorShape(col,pose,t,o){
  const c=pose==='crouch'?7:pose==='walk'?5:0,run=pose==='run',walk=pose==='walk';
  const lp=run?t*18:walk?t*6:0,bob=run?-Math.abs(Math.sin(lp))*3:walk?Math.sin(lp*2)*0.8:0;
  const by=-30+c+bob,amp=run?14:walk?7:0,lift=run?7:walk?3:0,hk=o.hk||0,tt=o.tail==null?t:o.tail;
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  leg(2,by+6,lp+Math.PI,amp,lift,6,true);
  const tw=Math.sin(tt*2.5)*(3+hk*6);
  ctx.beginPath();ctx.moveTo(-12,by-6);ctx.quadraticCurveTo(-38,by-8+tw*0.5,-64,by-6+tw);ctx.quadraticCurveTo(-38,by+2,-12,by+6);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,by,19,9.5,-0.12,0,7);ctx.fill();
  ctx.lineWidth=1.5+hk;ctx.beginPath();
  for(let i=0;i<8;i++){const fx=-22+i*5;ctx.moveTo(fx,by-7);ctx.lineTo(fx-5+hk*3,by-12-hk*9-Math.sin(i+t*2+hk*t*8)*(1+hk*1.5));}
  ctx.stroke();
  const hy=by-14+(pose==='crouch'?5:0);
  ctx.beginPath();ctx.moveTo(10,by-6);ctx.quadraticCurveTo(20,hy-2,28,hy-4);ctx.lineTo(45,hy);ctx.lineTo(44,hy+3);ctx.lineTo(30,hy+5);ctx.quadraticCurveTo(22,hy+8,15,by+4);ctx.closePath();ctx.fill();
  if(o.snarl){ctx.beginPath();ctx.moveTo(30,hy+4);ctx.lineTo(44,hy+3);ctx.lineTo(42,hy+9);ctx.closePath();ctx.fill();}
  ctx.beginPath();ctx.moveTo(8,by-1);ctx.lineTo(22,by+9);ctx.lineTo(6,by+7);ctx.closePath();ctx.fill();
  leg(2,by+6,lp,amp,lift,6,true);
  return {ex:31,ey:hy-1};
}
function drawRaptor(x,y,s,pose,t,face,o){
  o=o||{};
  ctx.save();ctx.translate(x,y);ctx.scale(s*(face||1),s);
  if(o.lean)ctx.rotate(o.lean);
  const p=pose==='pounce'?'run':pose;
  ctx.save();ctx.translate(-1.4,-1.4);ctx.globalAlpha=0.6;raptorShape(RIM,p,t,o);ctx.restore();
  const e=raptorShape(COL,p,t,o);
  if(o.scar){ctx.strokeStyle='rgba(254,215,170,0.85)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(e.ex-5,e.ey-5);ctx.lineTo(e.ex+6,e.ey+6);ctx.stroke();}
  ctx.fillStyle=o.eye||'#fbbf24';ctx.beginPath();ctx.arc(e.ex,e.ey,o.eyeR||1.4,0,7);ctx.fill();
  ctx.restore();
}
function drawCarcass(x,y){
  const sh=c=>{ctx.fillStyle=c;ctx.strokeStyle=c;ctx.beginPath();ctx.ellipse(0,-8,24,9,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-20,-10);ctx.quadraticCurveTo(-40,-5,-54,-2);ctx.lineTo(-20,-2);ctx.fill();
    ctx.beginPath();ctx.moveTo(20,-10);ctx.quadraticCurveTo(32,-7,40,-3);ctx.lineTo(46,-1);ctx.lineTo(22,-1);ctx.fill();
    ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-14);ctx.lineTo(3,-26);ctx.moveTo(7,-14);ctx.lineTo(16,-23);ctx.stroke();};
  ctx.save();ctx.translate(x-1.2,y-1.2);ctx.globalAlpha=0.5;sh(RIM);ctx.restore();
  ctx.save();ctx.translate(x,y);sh(COL);ctx.restore();
}
function drawFern(x,y,h,col,t,n,spread){
  n=n||5;spread=spread||0.9;ctx.strokeStyle=col;ctx.lineCap='round';
  for(let k=0;k<n;k++){
    const a=-spread+2*spread*(n===1?0.5:k/(n-1))+Math.sin(t*1.2+x*0.05+k)*0.04;
    const tx=x+Math.sin(a)*h,ty=y-Math.cos(a)*h*0.95,cx=x+Math.sin(a)*h*0.3,cy=y-h*0.75;
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(cx,cy,tx,ty);ctx.stroke();
    ctx.lineWidth=1.6;ctx.beginPath();
    for(let i=1;i<8;i++){
      const s=i/8,u=1-s,px=u*u*x+2*u*s*cx+s*s*tx,py=u*u*y+2*u*s*cy+s*s*ty;
      const dx=2*u*(cx-x)+2*s*(tx-cx),dy=2*u*(cy-y)+2*s*(ty-cy),L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,len=h*0.17*(1-s*0.8);
      ctx.moveTo(px,py);ctx.lineTo(px+nx*len+dx/L*len*0.5,py+ny*len+dy/L*len*0.5);
      ctx.moveTo(px,py);ctx.lineTo(px-nx*len+dx/L*len*0.5,py-ny*len+dy/L*len*0.5);
    }
    ctx.stroke();
  }
}
function mkRidge(n,step,lo,hi,seed){const pts=[];for(let i=0;i<n;i++)pts.push(lo+hash(i*3.7+seed)*(hi-lo));return{pts,step};}
const FAR=mkRidge(30,60,55,130,1),MID=mkRidge(30,44,28,80,7),NEAR=mkRidge(40,30,8,34,13);
function ridgeH(R,wx){const L=R.pts.length;const u=((wx/R.step)%L+L)%L,i=Math.floor(u),f=u-i,s=f*f*(3-2*f);return R.pts[i]+(R.pts[(i+1)%L]-R.pts[i])*s;}
function ridge(R,off,gy,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,gy);for(let x=0;x<=W;x+=8)ctx.lineTo(x,gy-ridgeH(R,x+off));ctx.lineTo(W,gy);ctx.closePath();ctx.fill();}
function ptero(x,y,s){const f=Math.sin(T*5+x*0.03)*4*s;ctx.strokeStyle='#3b1530';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-10*s,y-f);ctx.quadraticCurveTo(x-4*s,y-3*s,x,y);ctx.quadraticCurveTo(x+4*s,y-3*s,x+10*s,y-f);ctx.stroke();}
function drawWorld(cx,heat){
  const sh=SH(),gy=GY();heat=heat||0;
  const g=ctx.createLinearGradient(0,0,0,gy);
  g.addColorStop(0,'#1a0d2e');g.addColorStop(0.45,'#6d2747');g.addColorStop(0.82,'#df5a3c');g.addColorStop(1,'#fcb672');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);
  const sx=W*0.66,sy=gy-80;
  const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,150);
  sg.addColorStop(0,'rgba(255,237,180,0.85)');sg.addColorStop(0.25,'rgba(253,186,116,0.3)');sg.addColorStop(1,'rgba(253,186,116,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,gy);
  ctx.fillStyle='#fff1c9';ctx.beginPath();ctx.arc(sx,sy,32,0,7);ctx.fill();
  for(let i=0;i<3;i++){const px=((T*13+i*170)%(W+120))-60,py=gy*0.22+i*26+Math.sin(T+i)*6;ptero(px,py,0.6+i*0.15);}
  ridge(FAR,cx*0.08,gy,'#5a2242');
  const vx=((260-cx*0.12)%1000+1000)%1000-200,vb=gy-40;
  ctx.fillStyle='#4a1b37';ctx.beginPath();ctx.moveTo(vx-90,vb+40);ctx.lineTo(vx-16,vb-110);ctx.lineTo(vx+16,vb-110);ctx.lineTo(vx+90,vb+40);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,90,40,0.7)';ctx.fillRect(vx-14,vb-112,28,3);
  for(let i=0;i<6;i++){const k=(T*0.15+i/6)%1;ctx.fillStyle=`rgba(50,25,45,${0.5*(1-k)})`;ctx.beginPath();ctx.arc(vx+Math.sin(k*4+i)*10+k*40,vb-115-k*90,8+k*22,0,7);ctx.fill();}
  ridge(MID,cx*0.25,gy,'#3a1430');
  ridge(NEAR,cx*0.5,gy,'#25101e');
  ctx.fillStyle='#130810';ctx.fillRect(0,gy,W,sh-gy);
  const step=48;
  for(let i=Math.floor(cx/step)-1;i<=Math.floor((cx+W)/step)+1;i++)drawFern(i*step+hash(i)*30-cx,gy+3,14+hash(i+9)*20,'#1e0d17',T,5,1.0);
  if(heat>0){ctx.fillStyle=`rgba(180,20,20,${heat*0.18})`;ctx.fillRect(0,0,W,sh);}
}
function drawForeground(cx){
  const sh=SH(),step=95,c=cx*1.3;
  for(let i=Math.floor(c/step)-1;i<=Math.floor((c+W)/step)+1;i++)drawFern(i*step+hash(i+50)*40-c,sh+8,26+hash(i+70)*20,'#070305',T,6,1.1);
  const v=ctx.createRadialGradient(W/2,sh*0.45,sh*0.3,W/2,sh*0.45,sh*0.85);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,sh);
}
function clawMark(x,y,col){ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<3;i++){ctx.moveTo(x+i*6,y);ctx.lineTo(x+i*6+8,y+16);}ctx.stroke();}

/* ================= data ================= */
const SIGN_OPTIONS=['Hot face','Clenched fists','Tight chest','Racing heart','Loud voice','Shaky body','Teary eyes','Want to lash out'];
const SIGN_T=[0.3,0.55,0.8],LOCK=0.7;
let mySigns=[];
try{const s=JSON.parse(localStorage.getItem('apex-signs')||'[]');if(Array.isArray(s)&&s.length===3)mySigns=s;}catch(e){}
function saveSigns(){try{localStorage.setItem('apex-signs',JSON.stringify(mySigns));}catch(e){}}
const EVENTS=[

const CHOICES=[{k:'attack',label:'ATTACK',col:'#dc2626'},{k:'stand',label:'STAND TALL',col:'#f59e0b'},{k:'walk',label:'WALK AWAY',col:'#a8a29e'},{k:'scar',label:'GET SCAR',col:'#38bdf8'}];

/* ================= input ================= */
const pointers=new Map(),keys={breathe:false};
let buttons=[];
function loc(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
const P0=()=>H-PANEL;
const BREATHE_R=()=>({x:14,y:P0()+70,w:150,h:110});
const CH_R=i=>({x:172+(i%2)*110,y:P0()+70+Math.floor(i/2)*58,w:104,h:52});
const MUTE=()=>({x:W-38,y:SH()-38,w:30,h:30});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();const p=loc(e);pointers.set(e.pointerId,p);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(state==='game'&&inR(p,MUTE())){toggleMute();pointers.delete(e.pointerId);return;}
  if(card){dismissCard();pointers.delete(e.pointerId);return;}
  for(const b of buttons)if(inR(p,b)){b.cb();pointers.delete(e.pointerId);break;}
});
cv.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,loc(e));});
for(const t of ['pointerup','pointercancel'])cv.addEventListener(t,e=>pointers.delete(e.pointerId));
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key;audioInit();
  if(k===' '){e.preventDefault();if(card&&!e.repeat){dismissCard();return;}keys.breathe=true;}
  if(k==='Enter'){if(card){dismissCard();return;}const b=buttons.find(b=>b.primary);if(b)b.cb();}
  if(state==='game'&&'1234'.includes(k)&&k!==''){const b=buttons.find(b=>b.choice===CHOICES[+k-1].k);if(b)b.cb();}
  if(k==='m'||k==='M')toggleMute();
});
addEventListener('keyup',e=>{if(e.key===' ')keys.breathe=false;});
function breatheHeld(){if(keys.breathe)return true;const r=BREATHE_R();for(const p of pointers.values())if(inR(p,r))return true;return false;}

/* ================= game ================= */
let state='title',G=null,T=0,card=null;
function say(text,dur,prio,who){if(!G)return;prio=prio||0;if(G.msgT>0&&prio<G.msgPrio)return;G.msg=text;G.msgT=dur||4;G.msgPrio=prio;G.msgWho=who||'scar';}
function sayNext(text,dur,who){G.queue.push({text,dur,who});}
function dismissCard(){if(card&&card.born!=null&&T-card.born<0.7)return;const c=card;card=null;SFX.click();if(c&&c.cb)c.cb();}
function actor(x,face,s){return{x,tx:x,face,s,sp:110,on:true};}
function newGame(){
  G={attacks:0,repaired:false,rp:null,rage:0,prevRage:0,B:{ph:'idle',t:0},breaths:0,tookOver:0,early:0,trust:0,meat:true,injured:false,
     ev:-1,es:null,step:'intro',msg:null,msgT:0,msgPrio:0,msgWho:'scar',queue:[],hints:{},floats:[],dust:null,beat:0,hbT:0.5,
     me:actor(150,1,1),scar:actor(58,1,1.15),nip:actor(470,-1,0.72),fang:actor(470,-1,1.12),carcass:{x:218,on:true},
     standT:0,practiceT:null,gapHint:false};
  G.nip.on=false;G.fang.on=false;
}
function startGame(){
  state='game';newGame();
  card={title:'OLD SCAR',sub:'Leader of the pack',
    body:"You brought down your first prey today. The pack will eat well.\n\nRage isn't bad. It tells you something matters to you. But when it takes over, it makes young hunters reckless. I know. I nearly lost everything to mine.\n\nTonight I'll teach you how I tamed it.",
    cb:()=>{state='signs';}};
}
function replay(){newGame();state='signs';}
function afterSigns(){
  saveSigns();state='game';
  card={title:'THE LONG EXHALE',sub:'Rage gets your body ready to fight. A long, slow breath OUT tells it to stand down.',
    body:"HOLD Breathe and breathe IN as the circle grows.\n\nLET GO and breathe OUT slowly as it shrinks.\n\nDo it for real, with your own lungs. Not just your thumb.",
    cb:()=>{G.step='practice';G.rage=0.45;G.prevRage=0.45;say("Feel that? Rage is already past your first sign. Hold BREATHE and breathe in for real.",6,2);}};
}
function chooseCard(){
  card={title:'THEN CHOOSE',sub:'Rage only gives you one choice: attack. A calm hunter has four.',
    body:"STAND TALL: hold your ground, calm and strong.\nWALK AWAY: not every fight is worth it.\nGET SCAR: ask the pack leader for help.\n\nIf rage gets too high you can't think straight, and those choices LOCK until you breathe.\n\nIf it fills up completely, rage takes over and makes the choice for you.",
    cb:()=>startEvent(0)};
}
function startEvent(i){
  G.ev=i;const e=EVENTS[i],a=G[e.who];
  a.on=true;if(i!==2){a.x=470;}a.tx=e.enter;a.face=-1;a.sp=i===2?160:110;
  G.es={ph:'arrive',firstBreath:null,peak:G.rage,anim:0,choice:null,forced:false,dragT:0,snarlT:1};
  G.step='event';G.gapHint=false;
}
function finish(){G.step='done';state='notes';G.notesT=0;}
function startRepair(){G.step='repair';G.rp={ph:'arrive',anim:0};const n=G.nip;n.on=true;n.x=470;n.tx=330;n.sp=45;
  say("Nip creeps back, keeping his distance. After what he saw, he's wary of you.",5,3,'narr');
  sayNext("Everyone loses it sometimes. What you do next is what the pack remembers.",5,'scar');}
function chooseRepair(k){const rp=G.rp;if(!rp||rp.ph!=='live')return;rp.ph='resolve';rp.anim=0;rp.choice=k;
  if(k==='peace'){G.trust++;G.repaired=true;G.nip.tx=G.me.x+62;G.nip.sp=55;SFX.chirp();}else{G.nip.tx=470;G.nip.sp=60;}}
function updRepair(dt){const rp=G.rp,n=G.nip;
  if(rp.ph==='arrive'){if(!move(n,dt))rp.ph='live';}
  else if(rp.ph==='resolve'){rp.anim+=dt;move(n,dt);
    if(rp.anim>2.4){rp.ph='card';const p=rp.choice==='peace';if(!p)n.on=false;
      card={title:p?'YOU MADE PEACE':'NOT YET',sub:p?"You lower your head and let Nip come close. He settles beside you.":"Nip keeps his distance for now.",
        body:p?"\"That took more courage than any fight. Trust comes back, one calm moment at a time.\"\n\nPack trust: rising":"\"That's all right. You can't make peace until you're calm. The chance will come again.\"",cb:finish};}}}
function startBreathStats(){if(G.es&&G.es.ph==='live'&&G.es.firstBreath===null)G.es.firstBreath=G.rage;}
function updBreath(dt){
  const B=G.B,hold=breatheHeld();
  if(B.ph==='idle'){if(hold){B.ph='in';B.t=0;SFX.inhale();startBreathStats();}}
  else if(B.ph==='in'){
    if(hold){B.t+=dt;if(B.t>=3){B.ph='full';B.t=0;}}
    else{B.ph='idle';say("All the way in. Keep holding until the circle is full.",3,2);}
  }else if(B.ph==='full'){B.t+=dt;if(B.t>2.5&&!G.hints.letgo){G.hints.letgo=1;say("Now let go, and breathe out slowly.",3,2);}if(!hold){B.ph='out';B.t=0;SFX.exhale();}}
  else if(B.ph==='out'){
    if(hold){if(!G.hints.outHold){G.hints.outHold=1;say("Let go. Let it ALL out. Slowly.",2.5,2);}}
    else{B.t+=dt;G.rage=Math.max(0,G.rage-0.075*dt);
      if(B.t>=5){B.ph='idle';G.breaths++;SFX.good();
        const lines=["That's it. Slow out-breaths tell your body the fight is over.","Good. Feel it drop?","Again if you need it. There's no rush.","That's the Long Exhale. Your best weapon."];
        say(lines[Math.min(G.breaths-1,lines.length-1)],3,1);}}
  }
}
function move(a,dt){if(!a.on)return false;const d=a.tx-a.x;if(Math.abs(d)<1){a.x=a.tx;return false;}a.x+=Math.sign(d)*Math.min(Math.abs(d),a.sp*dt);return true;}
function choose(k,forced){
  const es=G.es;if(!es||es.ph!=='live')return;
  if(!forced&&k!=='attack'&&G.rage>=LOCK){SFX.bad();say("Too much rage to think straight. Long Exhale first.",3,3);return;}
  const e=EVENTS[G.ev];es.ph='resolve';es.choice=k;es.forced=!!forced;es.anim=0;
  const o=OUT[e.key][k];
  es.calm=k!=='attack'&&G.rage<SIGN_T[1];es.dTrust=k==='attack'?-1:(es.calm?1:0);if(k==='attack')G.attacks++;
  G.trust+=es.dTrust;if(o.injure)G.injured=true;if(o.meat===false)G.meat=false;
  if(forced)G.tookOver++;
  else if(k!=='attack'&&((es.firstBreath!==null&&es.firstBreath<SIGN_T[1])||es.peak<SIGN_T[1]))G.early++;
  const tgt=G[e.who];
  if(k==='attack'){G.me.tx=tgt.x-40;G.me.sp=260;SFX.roar();setTimeout(()=>SFX.fight(),300);}
  else if(k==='stand'){G.standT=2.2;SFX.lowgrowl();}
  else if(k==='walk'){G.me.tx=112;G.me.face=-1;G.me.sp=70;}
  else if(k==='scar'){SFX.chirp();G.scar.tx=G.me.x+30;G.scar.sp=130;}
}
function resolveDone(){
  const e=EVENTS[G.ev],es=G.es,o=OUT[e.key][es.choice];
  let title={attack:'YOU ATTACKED',stand:'YOU STOOD TALL',walk:'YOU WALKED AWAY',scar:'YOU GOT SCAR'}[es.choice];
  let sub=o.line,body='';
  if(es.forced){title='RAGE TOOK OVER';body="\"Your signs were there: "+mySigns[0]+", then "+mySigns[1]+". Next time, breathe at the very first one. It's easiest to stop rage when it's small.\"";}
  else if(es.choice==='attack')body="\"You had other choices. Rage just shouts the loudest.\"";
  else if(!es.calm)body="\"It worked, but you were still running hot. One more Long Exhale and you choose with a clear head.\"";
  else if(es.firstBreath!==null)body="\"You breathed before you chose. That's the whole secret.\"";
  else body="\"You kept your head. Remember how that felt.\"";
  const t=es.dTrust>0?'Pack trust: rising':es.dTrust<0?'Pack trust: shaken':'Pack trust: steady';
  card={title,sub,body:body+'\n\n'+t+(o.injure?'  ·  You are hurt':'')+(o.meat===false?'  ·  The meat is gone':''),bad:es.choice==='attack',cb:()=>{es.ph='gap';es.gapT=0;if(es.choice==='attack'){G.gapHint=true;say("Fighting didn't burn the rage off. Feel it? Still there. Long Exhale. I'll wait.",6,2);}}};
}
function updEvent(dt){
  const e=EVENTS[G.ev],es=G.es,a=G[e.who],me=G.me;
  if(es.ph==='arrive'){
    if(G.ev===2&&a.x<330&&!es.grab){es.grab=true;}
    if(!move(a,dt)){es.ph='live';G.rage=Math.max(G.rage,Math.min(0.92,G.rage+e.spike));es.peak=Math.max(es.peak,G.rage);
      SFX.snarl();G.shake=0.4;say(e.intro,4.5,3,'narr');sayNext(e.hint,4,'scar');}
  }else if(es.ph==='live'){
    if(!(G.B.ph==='in'||G.B.ph==='out'||(G.B.ph==='full'&&G.B.t<2)))G.rage=Math.min(1,G.rage+e.simmer*(G.tookOver?0.6:1)*dt);
    es.peak=Math.max(es.peak,G.rage);
    if(e.key==='taunt'){es.snarlT-=dt;if(es.snarlT<=0){es.snarlT=rand(1.8,3);SFX.snarl();}}
    if(e.key==='steal'){a.tx=345;a.sp=10;move(a,dt);G.carcass.x=a.x-44;}
    if(G.rage>=0.999){G.rage=1;choose('attack',true);}
  }else if(es.ph==='resolve'){
    es.anim+=dt;const k=es.choice;
    if(k==='attack'){
      move(me,dt);
      if(es.anim>0.35&&!G.dust)G.dust={x:(me.x+a.x)/2+20,t:0};
      if(es.anim>1.6){a.tx=480;a.sp=220;if(e.key==='steal'&&!G.meat){G.carcass.x=a.x-44;}me.tx=150;me.sp=90;}
      if(es.anim>1.6)move(a,dt);
    }else if(k==='stand'){
      if(es.anim>1.0){a.tx=480;a.sp=110;move(a,dt);}
    }else if(k==='walk'){
      move(me,dt);
      if(es.anim>1.2){a.tx=480;a.sp=90;move(a,dt);if(e.key==='steal')G.carcass.x=a.x-44;}
    }else if(k==='scar'){
      move(G.scar,dt);if(es.anim>1.0){a.tx=480;a.sp=150;move(a,dt);}
    }
    if(e.key==='bump'&&k==='attack'&&es.anim>0.5&&!es.yelped){es.yelped=true;SFX.yelp();}
    if(es.anim>2.6){
      if(!G.meat)G.carcass.on=false;
      a.on=false;a.x=470;
      resolveDone();es.ph='card';
    }
  }else if(es.ph==='gap'){
    es.gapT+=dt;
    me.tx=150;me.face=1;me.sp=70;move(me,dt);G.scar.tx=58;G.scar.sp=70;move(G.scar,dt);
    if(G.B.ph==='idle')G.rage=Math.max(0,G.rage-0.012*dt);
    if(G.rage>=0.35&&!G.gapHint&&es.gapT>1){G.gapHint=true;say("Still feeling it? Check your signs. A Long Exhale now, before anything else happens.",5,2);}
    if((G.rage<0.35&&es.gapT>2.5)||es.gapT>(es.choice==='attack'?22:12)){
      if(G.ev<2)startEvent(G.ev+1);
      else if(G.attacks>0)startRepair();
      else finish();
    }
  }
}
function update(dt){
  if(state!=='game'||!G)return;
  if(G.msgT>0)G.msgT-=dt;else if(G.queue.length){const q=G.queue.shift();say(q.text,q.dur,1,q.who);}
  G.beat=Math.max(0,G.beat-dt*4);
  if(G.shake>0)G.shake-=dt;
  if(G.standT>0)G.standT-=dt;
  for(const f of G.floats)f.t+=dt;G.floats=G.floats.filter(f=>f.t<2.2);
  if(G.dust){G.dust.t+=dt;if(G.dust.t>1.4)G.dust=null;}
  // audio follow
  if(growlG)try{growlG.gain.setTargetAtTime(Math.max(0,G.rage-0.3)*0.28,AC.currentTime,0.2);}catch(e){}
  G.hbT-=dt;if(G.hbT<=0){G.hbT=60/(64+G.rage*90);if(G.rage>0.15)SFX.lubdub(0.4+G.rage*0.6);G.beat=1;}
  if(card)return;
  if(G.step==='practice'||G.step==='event'||G.step==='repair')updBreath(dt);
  if(G.step==='practice'&&G.breaths>=1&&G.practiceT===null)G.practiceT=3;
  if(G.practiceT!==null&&G.step==='practice'){G.practiceT-=dt;if(G.practiceT<=0){G.practiceT=null;G.step='chooseCard';chooseCard();}}
  if(G.step==='event')updEvent(dt);
  if(G.step==='repair')updRepair(dt);
  // sign crossings
  for(let i=0;i<3;i++)if(G.prevRage<SIGN_T[i]&&G.rage>=SIGN_T[i]){
    G.floats.push({text:mySigns[i],x:G.me.x,y:GY()-80,t:0});
    if(i===0)G.hintSign||(G.hintSign=1,sayNext("There. "+mySigns[0]+". That's your first warning sign. Best time to breathe.",4,'scar'));
  }
  G.prevRage=G.rage;
}

function drawMsg(){
  if(!G||!G.msg||G.msgT<=0)return;
  ctx.globalAlpha=Math.min(1,G.msgT*3);
  const narr=G.msgWho==='narr';
  ctx.font=narr?FB(15,500):FS(15);const lines=wrapLines(G.msg,W-86),h=Math.max(58,30+lines.length*19);
  ctx.fillStyle='rgba(10,5,8,0.85)';rr(10,10,W-20,h,10);ctx.fill();
  ctx.fillStyle=narr?'#e7e5e4':'#f59e0b';ctx.fillRect(10,14,3,h-8);
  if(!narr){clawMark(24,22,'#f59e0b');ctx.textAlign='left';ctx.fillStyle='#f59e0b';ctx.font=FH(11,500);ctx.fillText('SCAR',24,52);}
  else{ctx.textAlign='left';ctx.fillStyle='#a8a29e';ctx.font=FH(11,500);ctx.fillText('NOW',24,34);}
  ctx.fillStyle=narr?'#fafaf9':'#fef3c7';ctx.font=narr?FB(15,500):FS(15);let y=32;for(const l of lines){ctx.fillText(l,62,y);y+=19;}
  ctx.globalAlpha=1;
}
function drawScene(){
  const gy=GY(),me=G.me,es=G.es;
  const sx=G.shake>0?Math.sin(T*90)*G.shake*8:0;
  ctx.save();ctx.translate(sx,0);
  drawWorld(0,G.rage);
  // Scar
  drawRaptor(G.scar.x,gy+2,G.scar.s,Math.abs(G.scar.tx-G.scar.x)>1?'walk':'stand',T,1,{scar:true,eye:'#fde68a'});
  if(G.carcass.on&&G.carcass.x<440)drawCarcass(G.carcass.x,gy+2);
  // Nip / Fang
  for(const who of ['nip','fang']){
    const a=G[who];if(!a.on)continue;
    const moving=Math.abs(a.tx-a.x)>1;
    const taunting=who==='fang'&&es&&es.ph==='live'&&EVENTS[G.ev].key==='taunt';
    const pose=moving?(a.sp>140?'run':'walk'):taunting?(Math.sin(T*4)>0?'crouch':'stand'):(who==='nip'?'crouch':'stand');
    drawRaptor(a.x,gy+2,a.s,pose,moving?T:T*0.6,a.tx>a.x?1:-1,{eye:who==='fang'?'#ef4444':'#fbbf24',snarl:who==='fang'&&!moving,hk:who==='fang'?0.6:0});
  }
  // me
  const moving=Math.abs(me.tx-me.x)>1,r=G.rage;
  const pose=moving?(me.sp>200?'run':'walk'):(G.standT>0?'stand':(r>0.55?'stand':'crouch'));
  const eye=r>SIGN_T[1]?`rgb(${Math.round(251-10*r)},${Math.round(191-170*r)},${Math.round(36-20*r)})`:'#fbbf24';
  const faceDir=moving?(me.tx>me.x?1:-1):me.face;
  drawRaptor(me.x,gy+2,(G.standT>0?1.12:1),pose,moving?T:T,faceDir,{hk:r,tail:T*(1+r*3),eye,eyeR:1.4+r*0.8,snarl:r>0.55,lean:G.injured&&!moving?0.06:0});
  if(G.dust){const d=G.dust,k=d.t/1.4;for(let i=0;i<9;i++){ctx.fillStyle=`rgba(110,80,70,${0.55*(1-k)})`;ctx.beginPath();ctx.arc(d.x+Math.sin(i*2.3+d.t*9)*24,gy-18+Math.cos(i*1.7+d.t*7)*14,10+k*18+hash(i)*8,0,7);ctx.fill();}}
  drawForeground(0);
  ctx.restore();
  // floating sign labels
  for(const f of G.floats){const k=f.t/2.2;ctx.globalAlpha=1-k;ctx.fillStyle='#fca5a5';ctx.font=FH(16);ctx.textAlign='center';ctx.fillText(f.text.toUpperCase(),f.x,f.y-k*30);}
  ctx.globalAlpha=1;
  // breathing circle
  const B=G.B;
  if(B.ph!=='idle'){
    let k=B.ph==='in'?B.t/3:B.ph==='full'?1:1-B.t/5;
    const cx=W/2,cy=SH()*0.42,rad=26+70*k;
    ctx.fillStyle='rgba(125,211,252,0.10)';ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.fill();
    ctx.strokeStyle='rgba(186,230,253,0.85)';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#e0f2fe';ctx.textAlign='center';ctx.font=FH(22);
    const txt=B.ph==='in'?'BREATHE IN…':B.ph==='full'?'NOW LET GO':'BREATHE OUT… SLOWLY';
    ctx.fillText(txt,cx,cy+8);
    if(B.ph==='in'||B.ph==='out'){ctx.font=FH(15,500);ctx.fillStyle='rgba(224,242,254,0.7)';ctx.fillText(B.ph==='in'?Math.ceil(3-B.t):Math.ceil(5-B.t),cx,cy+32);}
  }
  // heat vignette
  if(r>0.3){const a=(r-0.3)*0.8*(0.6+G.beat*0.4);const v=ctx.createRadialGradient(W/2,SH()/2,SH()*0.3,W/2,SH()/2,SH()*0.8);v.addColorStop(0,'rgba(127,29,29,0)');v.addColorStop(1,`rgba(127,29,29,${a})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,SH());}
}
function drawMute(){

  ctx.fillStyle='#d6d3d1';ctx.beginPath();ctx.moveTo(r.x+8,r.y+12);ctx.lineTo(r.x+12,r.y+12);ctx.lineTo(r.x+17,r.y+8);ctx.lineTo(r.x+17,r.y+22);ctx.lineTo(r.x+12,r.y+18);ctx.lineTo(r.x+8,r.y+18);ctx.closePath();ctx.fill();

  ctx.font=FB(11,600);ctx.fillStyle='#7dd3fc';
  ctx.fillText(B.ph==='idle'?'HOLD TO BREATHE IN':B.ph==='in'?'KEEP HOLDING…':B.ph==='full'?'NOW LET GO':'BREATHE OUT SLOWLY',br.x+br.w/2,br.y+72);
  ctx.fillStyle='#57534e';ctx.font=FB(10);ctx.fillText('IN 3 · OUT 5',br.x+br.w/2,br.y+92);
  // choices
  const live=G.step==='event'&&G.es&&G.es.ph==='live';
  if(live){
    CHOICES.forEach((c,i)=>{
      const R=CH_R(i),locked=c.k!=='attack'&&r>=LOCK;
      buttons.push({...R,choice:c.k,cb:()=>choose(c.k,false)});
      ctx.fillStyle=locked?'#1c1917':'#211a1a';rr(R.x,R.y,R.w,R.h,10);ctx.fill();
      ctx.strokeStyle=locked?'#3f3a36':c.col;ctx.lineWidth=2;ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle=locked?'#57534e':c.col;ctx.font=FH(c.label.length>7?15:17);
      ctx.fillText(c.label,R.x+R.w/2,R.y+R.h/2+(locked?0:6));
      if(locked){ctx.font=FB(9,600);ctx.fillStyle='#78716c';ctx.fillText('LOCKED · BREATHE',R.x+R.w/2,R.y+R.h/2+15);}
    });
  }else if(G.step==='repair'&&G.rp&&G.rp.ph==='live'){
    [['peace','MAKE PEACE','#38bdf8'],['wait','NOT YET','#a8a29e']].forEach((c,i)=>{
      const R={x:172,y:P+70+i*58,w:214,h:52};buttons.push({...R,cb:()=>chooseRepair(c[0])});
      ctx.fillStyle='#211a1a';rr(R.x,R.y,R.w,R.h,10);ctx.fill();ctx.strokeStyle=c[2];ctx.lineWidth=2;ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle=c[2];ctx.font=FH(17);ctx.fillText(c[1],R.x+R.w/2,R.y+R.h/2+6);});
  }else{
    ctx.textAlign='left';ctx.fillStyle='#78716c';ctx.font=FS(14);
    const t=G.step==='repair'?"":G.step==='practice'?"Practise one Long Exhale. Breathe in for 3, then out slowly for 5.":
      G.es&&G.es.ph==='arrive'?"Something's coming…":G.es&&G.es.ph==='gap'?(r>=0.35?"Calm down before the next thing happens. Breathe.":"Steady. Enjoy your meal…"):"";
    wrap(t,176,P+92,W-192,19);
  }
}
function drawCard(){
  ctx.fillStyle='rgba(5,2,4,0.74)';ctx.fillRect(0,0,W,H);
  const x=20,w=W-40;
  ctx.font=FS(15);const sub=wrapLines(card.sub,w-40);
  ctx.font=FB(15);const body=wrapLines(card.body,w-40);
  let h=40+38+sub.length*20+14+body.reduce((a,l)=>a+(l===''?10:21),0)+46;
  const y=Math.max(12,(H-h)/2);
  ctx.fillStyle='#16100f';rr(x,y,w,h,16);ctx.fill();
  ctx.strokeStyle=card.bad?'#7f1d1d':'#78350f';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='left';let yy=y+46;
  ctx.fillStyle=card.bad?'#f87171':'#f59e0b';ctx.font=FH(28);ctx.fillText(card.title,x+20,yy);yy+=26;
  ctx.fillStyle='#fde68a';ctx.font=FS(15);for(const l of sub){ctx.fillText(l,x+20,yy);yy+=20;}
  yy+=14;ctx.fillStyle='#e7e5e4';ctx.font=FB(15);
  for(const l of body){if(l==='')yy+=10;else{ctx.fillText(l,x+20,yy);yy+=21;}}
  ctx.textAlign='center';ctx.font=FH(13,500);ctx.fillStyle=`rgba(245,158,11,${0.55+0.45*Math.sin(T*4)})`;
  if(T-(card.born||T)>=0.7)ctx.fillText('TAP TO CONTINUE',W/2,y+h-20);
}
function button(label,cx,y,w,h,cb,opts){
  opts=opts||{};buttons.push({x:cx-w/2,y,w,h,cb,primary:!!opts.primary});
  const on=opts.enabled!==false;
  ctx.fillStyle=opts.ghost?'rgba(0,0,0,0)':(on?'#f59e0b':'#3f3a36');rr(cx-w/2,y,w,h,10);ctx.fill();
  if(opts.ghost){ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();}
  ctx.fillStyle=opts.ghost?'#f59e0b':(on?'#1c0a00':'#78716c');ctx.font=FH(19);ctx.textAlign='center';ctx.fillText(label,cx,y+h/2+7);
}

/* ================= screens ================= */
function drawTitle(){
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,SH());ctx.clip();
  drawWorld(T*6);
  const gy=GY();
  ctx.fillStyle='#0a0407';ctx.beginPath();ctx.moveTo(90,gy+6);ctx.lineTo(120,gy-30);ctx.lineTo(170,gy-44);ctx.lineTo(230,gy-38);ctx.lineTo(270,gy-12);ctx.lineTo(290,gy+6);ctx.closePath();ctx.fill();
  drawRaptor(190,gy-42,1.7,'stand',T,1,{hk:0.3+0.2*Math.sin(T)});
  drawForeground(T*6);
  ctx.restore();
  ctx.textAlign='center';const ty=Math.max(105,SH()*0.24);
  const g=ctx.createLinearGradient(0,ty-70,0,ty);g.addColorStop(0,'#fde68a');g.addColorStop(1,'#f59e0b');
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.font=FH(88);ctx.fillText('APEX',W/2+3,ty+3);
  ctx.fillStyle=g;ctx.fillText('APEX',W/2,ty);
  ctx.fillStyle='#fca5a5';ctx.font=FH(15,500);ctx.fillText('CHAPTER 1 · RAGE',W/2,ty+28);
  ctx.fillStyle='#fef3c7';ctx.font=FS(16);ctx.fillText('The strongest hunter controls the fire inside.',W/2,ty+52);
  ctx.fillStyle='#0f0a0c';ctx.fillRect(0,SH(),W,PANEL);
  button('BEGIN',W/2,SH()+40,240,56,startGame,{primary:true});
  ctx.fillStyle='#57534e';ctx.font=FB(11);ctx.fillText('PROTOTYPE · SOUND ON · ABOUT 4 MINUTES',W/2,H-26);
}
function drawSigns(){
  ctx.fillStyle='#0a0508';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.3;ctx.beginPath();ctx.rect(0,0,W,SH());ctx.clip();drawWorld(0);ctx.restore();
  ctx.textAlign='left';ctx.fillStyle='#f59e0b';ctx.font=FH(28);ctx.fillText('YOUR WARNING SIGNS',20,54);
  ctx.fillStyle='#fef3c7';ctx.font=FS(15);
  let y=wrap('"Every hunter feels rage coming before it takes over. What does yours feel like?"',20,84,W-40,20);
  ctx.fillStyle='#a8a29e';ctx.font=FB(13);y=wrap('Pick 3, in the order they usually happen to you.',20,y+6,W-40,18);
  const top=y+12,cw=(W-50)/2,ch=50;
  SIGN_OPTIONS.forEach((s,i)=>{
    const x=20+(i%2)*(cw+10),yy=top+Math.floor(i/2)*(ch+10),idx=mySigns.indexOf(s);
    buttons.push({x,y:yy,w:cw,h:ch,cb:()=>{SFX.click();if(idx>=0)mySigns.splice(idx,1);else if(mySigns.length<3)mySigns.push(s);}});
    ctx.fillStyle=idx>=0?'#3b1d12':'#1c1917';rr(x,yy,cw,ch,12);ctx.fill();
    ctx.strokeStyle=idx>=0?'#f59e0b':'#44403c';ctx.lineWidth=2;ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle=idx>=0?'#fde68a':'#d6d3d1';ctx.font=FH(16,500);ctx.fillText(s.toUpperCase(),x+14,yy+31);
    if(idx>=0){ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(x+cw-20,yy+25,12,0,7);ctx.fill();ctx.fillStyle='#1c0a00';ctx.textAlign='center';ctx.font=FH(14);ctx.fillText(idx+1,x+cw-20,yy+30);}
  });
  const after=top+4*(ch+10)+6;
  ctx.textAlign='center';ctx.fillStyle='#78716c';ctx.font=FS(13);
  ctx.fillText(mySigns.length?mySigns.join('  →  '):'1st sign  →  2nd  →  3rd',W/2,after+10);
  button(mySigns.length===3?'THESE ARE MINE':'PICK '+(3-mySigns.length)+' MORE',W/2,Math.max(after+28,H-90),260,54,()=>{if(mySigns.length===3)afterSigns();},{enabled:mySigns.length===3,primary:true});
}
function paperBG(){
  ctx.fillStyle='#0a0508';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.3;ctx.beginPath();ctx.rect(0,0,W,SH());ctx.clip();drawWorld(0);ctx.restore();
}
function drawNotes(){
  G.notesT=(G.notesT||0)+1/60;paperBG();
  ctx.globalAlpha=Math.min(1,G.notesT*1.5);
  const x=16,y=16,w=W-32,h=H-112;
  ctx.fillStyle='#e9dfc7';rr(x,y,w,h,6);ctx.fill();
  ctx.strokeStyle='rgba(120,90,60,0.18)';ctx.lineWidth=1;for(let ly=y+62;ly<y+h-8;ly+=22){ctx.beginPath();ctx.moveTo(x+14,ly);ctx.lineTo(x+w-14,ly);ctx.stroke();}
  ctx.textAlign='left';ctx.fillStyle='#3b2a1a';ctx.font=FH(28);ctx.fillText('FIELD NOTES',x+18,y+42);
  ctx.font=FS(14);ctx.fillStyle='#7c5a3a';ctx.textAlign='right';ctx.fillText('The Feast',x+w-18,y+42);
  let yy=y+80;
  const row=(l,v)=>{ctx.textAlign='left';ctx.font=FS(15);ctx.fillStyle='#4a3524';ctx.fillText(l,x+18,yy);ctx.textAlign='right';ctx.font=FH(16,500);ctx.fillStyle='#3b2a1a';ctx.fillText(String(v),x+w-18,yy);yy+=22;};
  row('Pack trust',G.trust>0?'Rising':G.trust<0?'Shaken':'Steady');
  row('Kept your kill',G.meat?'Yes':'No');
  row('Long Exhales taken',G.breaths);
  row('Caught rage early',G.early+' of 3');
  row('Times rage took over',G.tookOver);
  if(G.attacks>0)row('Made it right afterwards',G.repaired?'Yes':'Not yet');
  yy+=12;ctx.textAlign='left';ctx.font=FH(13,500);ctx.fillStyle='#9a3412';ctx.fillText('YOUR SIGNS',x+18,yy);yy+=20;
  ctx.font=FH(15,500);ctx.fillStyle='#3b2a1a';ctx.fillText(mySigns.join('  →  ').toUpperCase(),x+18,yy);yy+=28;
  ctx.font=FH(13,500);ctx.fillStyle='#9a3412';ctx.fillText("SCAR'S QUESTION",x+18,yy);yy+=20;
  ctx.font=FS(15);ctx.fillStyle='#3b2a1a';
  yy=wrap(`"Think about this week. When did you feel ${mySigns[0].toLowerCase()}? What happened just before?"`,x+18,yy,w-36,20);
  ctx.font=FB(12);ctx.fillStyle='#7c5a3a';wrap('Talk it through with a grown-up. There are no wrong answers.',x+18,yy+4,w-36,17);
  ctx.globalAlpha=1;
  button('MY RAGE PLAN',W/2-96,H-82,176,54,()=>{state='plan';},{primary:true});
  button('PLAY AGAIN',W/2+96,H-82,176,54,replay,{ghost:true});
}
function drawPlan(){
  ctx.fillStyle='#0a0508';ctx.fillRect(0,0,W,H);
  const x=16,y=16,w=W-32,h=H-112;
  ctx.fillStyle='#16100f';rr(x,y,w,h,16);ctx.fill();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();
  clawMark(x+20,y+22,'#f59e0b');
  ctx.textAlign='left';ctx.fillStyle='#f59e0b';ctx.font=FH(30);ctx.fillText('MY RAGE PLAN',x+52,y+44);
  let yy=y+86;
  const step=(n,head,lines,col)=>{
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+34,yy-6,15,0,7);ctx.fill();
    ctx.fillStyle='#1c0a00';ctx.textAlign='center';ctx.font=FH(16);ctx.fillText(n,x+34,yy-1);
    ctx.textAlign='left';ctx.fillStyle=col;ctx.font=FH(20);ctx.fillText(head,x+60,yy);yy+=24;
    ctx.fillStyle='#e7e5e4';ctx.font=FB(15);for(const l of lines){yy=wrap(l,x+60,yy,w-80,20);}yy+=16;
  };
  step('1','NOTICE MY SIGNS',[mySigns.map((s,i)=>(i+1)+'. '+s).join('\n'),'Breathe at the FIRST one.'],'#fca5a5');
  step('2','LONG EXHALE',['In for 3. Out slowly for 5. Repeat.'],'#7dd3fc');
  step('3','THEN CHOOSE',['Stand tall  ·  Walk away  ·  Get help'],'#f59e0b');
  step('4','IF RAGE WINS',['Calm down first. Then make it right.'],'#86efac');
  ctx.fillStyle='#2a1a1f';ctx.fillRect(x+20,yy-4,w-40,1);yy+=18;
  ctx.fillStyle='#a8a29e';ctx.font=FH(12,500);ctx.fillText('FOR GROWN-UPS',x+20,yy);yy+=18;
  ctx.font=FS(14);ctx.fillStyle='#d6d3d1';
  wrap('Try "Rage meter\'s rising. Long Exhale?" instead of "calm down". Breathe with them.',x+20,yy,w-40,19);
  ctx.textAlign='center';ctx.fillStyle='#57534e';ctx.font=FB(11);ctx.fillText('Screenshot this for the fridge',W/2,y+h-14);
  button('BACK',W/2-96,H-82,176,54,()=>{state='notes';},{ghost:true});
  button('PLAY AGAIN',W/2+96,H-82,176,54,replay,{primary:true});
}
function drawGame(){
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,SH());ctx.clip();
  drawScene();drawMsg();drawMute();
  ctx.restore();
  drawPanel();
  if(card)drawCard();
}

/* ================= loop ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;T+=dt;buttons=[];
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(card&&card.born==null)card.born=T;
  update(dt);
  if(state==='title')drawTitle();
  else if(state==='signs')drawSigns();
  else if(state==='game')drawGame();
  else if(state==='notes')drawNotes();
  else if(state==='plan')drawPlan();
  if(card&&state!=='game')drawCard();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
